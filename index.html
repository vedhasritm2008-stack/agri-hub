<title>Smart Agri Hub: Sell Smart</title>
<style>
:root{--bg:#f6f8f3;--card:#fff;--ink:#1d2a1f;--mut:#5d6b60;--acc:#2f7d32;--acc2:#e8f3e6;--warn:#b45309;--warnbg:#fff4e0;--line:#dfe6db}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a13;--card:#1a251c;--ink:#e8f0e6;--mut:#9fb0a2;--acc:#6fcf74;--acc2:#213a24;--warn:#fbbf24;--warnbg:#2c2410;--line:#2c3b2f}}
:root[data-theme="dark"]{--bg:#111a13;--card:#1a251c;--ink:#e8f0e6;--mut:#9fb0a2;--acc:#6fcf74;--acc2:#213a24;--warn:#fbbf24;--warnbg:#2c2410;--line:#2c3b2f}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Kannada",sans-serif;line-height:1.5}
header{background:var(--acc);color:#fff;padding:18px 20px}
header .in,main{max-width:900px;margin:0 auto}
header .in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.4rem}header p{margin:2px 0 0;opacity:.9;font-size:.95rem}
.lang button{background:transparent;border:1px solid #fff;color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:.9rem}
.lang button.on{background:#fff;color:var(--acc);font-weight:600}
main{padding:16px}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.1rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;background:var(--bg);color:var(--ink)}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button.p,button.s{padding:11px 18px;border-radius:10px;font-size:1rem;cursor:pointer;border:1px solid var(--acc)}
button.p{background:var(--acc);color:#fff}button.s{background:var(--acc2);color:var(--acc)}
#heard{margin-top:10px;font-size:.9rem;color:var(--mut);font-style:italic}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--acc2);border-radius:12px;padding:12px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:1.25rem}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.9rem}
.bar .n{width:190px;flex-shrink:0}.bar .t{flex:1;background:var(--acc2);border-radius:6px;height:22px;overflow:hidden}
.bar .f{background:var(--acc);height:100%}.bar .v{width:90px;text-align:right;font-weight:600}
.advice{padding:12px;border-radius:10px;background:var(--acc2);margin-top:10px;font-weight:600}
.loss{padding:12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-weight:600;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.9rem;display:block;overflow-x:auto}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
svg{width:100%;height:90px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:16px}
@media(max-width:560px){.bar .n{width:110px}}
</style>
</head>
<body>
<header><div class="in">
  <div><h1 data-i="title"></h1><p data-i="tag"></p></div>
  <div class="lang"><button id="en" class="on">English</button> <button id="kn">ಕನ್ನಡ</button></div>
</div></header>
<main>
<div class="note" data-i="note"></div>

<div class="card">
  <h2 data-i="ask"></h2>
  <div class="row">
    <div><label data-i="crop"></label><select id="crop"></select></div>
    <div><label data-i="dist"></label><select id="dist"></select></div>
    <div><label data-i="taluk"></label><select id="taluk"></select></div>
    <div><label data-i="qty"></label><input id="qty" type="number" min="1" value="20"></div>
  </div>
  <div class="btns">
    <button class="p" id="go" data-i="go"></button>
    <button class="s" id="mic" data-i="mic"></button>
  </div>
  <div id="heard"></div>
</div>

<div id="out"></div>

<div class="card">
  <h2 data-i="reg"></h2>
  <div class="row">
    <div><label data-i="soldAt"></label><select id="soldM"></select></div>
    <div><label data-i="soldP"></label><input id="soldP" type="number" value="1400"></div>
  </div>
  <div class="btns"><button class="s" id="regGo" data-i="regGo"></button></div>
  <div id="regOut"></div>
</div>

<div class="card">
  <h2 data-i="set"></h2>
  <div class="row">
    <div><label data-i="rate"></label><input id="rate" type="number" value="22"></div>
    <div><label data-i="cap"></label><input id="cap" type="number" value="25"></div>
    <div><label data-i="csv"></label><input id="file" type="file" accept=".csv"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div><label data-i="comm"></label><input id="comm" type="number" value="4"></div>
    <div><label data-i="load"></label><input id="load" type="number" value="15"></div>
    <div><label data-i="spoil"></label><input id="spoil" type="number" value="2"></div>
    <div><label data-i="farmers"></label><input id="farmers" type="number" min="1" value="3"></div>
    <div><label data-i="tgt"></label><input id="tgt" type="number" placeholder="e.g. 1900"></div>
    <div><label data-i="maxkm"></label><input id="maxkm" type="number" value="150"></div>
  </div>
</div>
</main>
<footer data-i="foot"></footer>

let prices=[];
(function seed(){
  let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const end=new Date(),ms=Object.keys(MAND);
  for(const c in CROPS)ms.forEach((m,mi)=>{
    const f=m.startsWith("Bengaluru")?(m.includes("KR")?1.15:1.12):0.9+((mi*5)%9)/50,dr=(r()-0.4)*0.012;
    let p=CROPS[c].b*f;
    for(let i=14;i>=0;i--){ d=new Date(end);d.setDate(end.getDate()-i);
      p*=1+(r()-0.5)*0.03+(i<8?dr:0);
      prices.push({date:d.toISOString().slice(0,10),mandi:m,crop:c,price:Math.round(p)});}
  });
})();
const roadKm=(a,b)=>{const R=6371,d=Math.PI/180,dl=(b[0]-a[0])*d,dn=(b[1]-a[1])*d;
  const h=Math.sin(dl/2)**2+Math.cos(a[0]*d)*Math.cos(b[0]*d)*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))*1.3;}; /* straight line x 1.3 = assumed road distance */
const getOrigin=()=>({name:$("taluk").value+", "+$("dist").value,c:TAL[$("dist").value][$("taluk").value]});

const transport=(km,q)=>km*(+$("rate").value)*Math.ceil(q/(+$("cap").value));
const cropRows=c=>prices.filter(p=>p.crop===c).sort((a,b)=>a.date.localeCompare(b.date));

function rank(crop,q,origin){
  const rows=cropRows(crop),latest={};rows.forEach(r=>latest[r.mandi]=r);
  const mk=+$("maxkm").value||150;
  return Object.values(latest).map(r=>({r,km:MAND[r.mandi]?roadKm(origin.c,MAND[r.mandi]):Infinity})).filter(x=>x.km<=mk).map(({r,km})=>{
    const tc=transport(km,q),cm=r.price*q*(+$("comm").value||0)/100,ld=(+$("load").value||0)*q;
    return{mandi:r.mandi,price:r.price,km:Math.round(km),tc,cm,ld,net:r.price*q-tc-cm-ld,date:r.date};
  }).sort((a,b)=>b.net-a.net);
}
function signal(series){
  if(series.length<5)return["stable",0];
  const avg=series.reduce((a,b)=>a+b)/series.length,s3=series.slice(-3).reduce((a,b)=>a+b)/3;
  const ch=(s3-avg)/avg*100;return[ch>5?"rising":ch<-5?"falling":"stable",ch];
}
function spark(vals){
  const mn=Math.min(...vals),mx=Math.max(...vals),w=400,h=80;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-4-((v-mn)/(mx-mn||1))*(h-8)}`).join(" ");
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--acc)" stroke-width="3" points="${pts}"/></svg>`;
}

function run(){
  const crop=$("crop").value,q=+$("qty").value||1,origin=getOrigin();
  const R=rank(crop,q,origin);
  if(!R.length){$("out").innerHTML=`<div class="card">${t("nodata")}</div>`;return;}
  const best=R[0],local=R.reduce((a,b)=>a.km<=b.km?a:b),max=best.net;
  const series=cropRows(crop).filter(r=>r.mandi===best.mandi).slice(-14).map(r=>r.price);
  const[sig]=signal(series);
  const extras=moreBlocks(best,series,q);
  $("out").innerHTML=`<div class="card"><h2>${t("best")}</h2>
    <div class="kpis">
      <div class="kpi"><small>${t("best")}</small><b>${best.mandi}</b></div>
      <div class="kpi"><small>${t("net")}</small><b>${inr(best.net)}</b></div>
      <div class="kpi"><small>${t("extra")}</small><b>${inr(best.net-local.net)}</b></div>
    </div>
    <div class="advice">${t(sig)}</div>${extras}
    <h2 style="margin-top:16px">${t("all")}</h2>
    ${R.map(r=>`<div class="bar"><div class="n">${r.mandi}</div><div class="t"><div class="f" style="width:${Math.max(4,r.net/max*100)}%"></div></div><div class="v">${inr(r.net)}</div></div>`).join("")}
    <h2 style="margin-top:16px">${t("trend")} · ${best.mandi}</h2>${spark(series)}
    <table><tr><th>${t("mkt")}</th><th>${t("price")}</th><th>${t("dist")}</th><th>${t("transp")}</th></tr>
    ${R.map(r=>`<tr><td>${r.mandi}</td><td>${inr(r.price)}</td><td>${r.km}</td><td>${inr(r.tc)}</td></tr>`).join("")}</table>
    <p style="color:var(--mut);font-size:.85rem">${t("date")}${best.date}</p>
    <div class="btns"><button class="s" id="shr">${t("share")}</button></div></div>`;
  $("shr").onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(`Smart Agri Hub: best market for ${q} qtl ${crop}: ${best.mandi}, about ${inr(best.net)} after costs (${inr(best.net-local.net)} more than ${local.mandi}). ${t(sig)}`));
  loadWeather(origin.name,origin.c,best.mandi,MAND[best.mandi]);
}

function moreBlocks(best,series,q){
  const n=series.length,xm=(n-1)/2,ym=series.reduce((a,b)=>a+b)/n;
  let num=0,den=0;series.forEach((y,i)=>{num+=(i-xm)*(y-ym);den+=(i-xm)**2;});
  const p3=best.price+(den?num/den:0)*3,loss=1-(+$("spoil").value||0)/100*3;
  const waitNet=p3*q*loss-best.tc-p3*q*(+$("comm").value||0)/100-(+$("load").value||0)*q;
  const nf=Math.max(1,+$("farmers").value||1),pooled=transport(best.km,q*nf)/nf;
  let tg="";
  try{const v=+$("tgt").value;localStorage.setItem("tgt",v||"");
    if(v)tg=`<div class="${best.price>=v?"advice":"loss"}">${best.price>=v?t("tgtHit"):t("tgtMiss")+" "+inr(best.price)}</div>`;}catch(e){}
  return `<h2 style="margin-top:16px">${t("wait")}</h2>
   <div class="kpis"><div class="kpi"><small>${t("nowNet")}</small><b>${inr(best.net)}</b></div><div class="kpi"><small>${t("waitNet")}</small><b>${inr(waitNet)}</b></div></div>
   <div class="advice">${waitNet>best.net?t("waitBetter"):t("nowBetter")}</div>
   <h2 style="margin-top:16px">${t("pool")}</h2>
   <div class="kpis"><div class="kpi"><small>${t("poolTxt")}</small><b>${inr(pooled)}</b></div><div class="kpi"><small>${t("poolSave")}</small><b>${inr(best.tc-pooled)}</b></div></div>
   ${tg}
   <h2 style="margin-top:16px">${t("wx")}</h2><div id="wx">${t("wxLoad")}</div>`;
}
/* Approximate coordinates (verify). Weather: Open-Meteo, free, needs internet. */
async function wxOf(c){
  if(!c)return null;
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}&daily=temperature_2m_max,precipitation_probability_max&timezone=Asia%2FKolkata&forecast_days=3`);
  return (await r.json()).daily;
}
async function loadWeather(a,ac,b,bc){
  const el=$("wx");if(!el)return;
  try{
    const out=[];let hot=false,wet=false;
    for(const [p,pc] of (a===b?[[a,ac]]:[[a,ac],[b,bc]])){
      const d=await wxOf(pc);if(!d)continue;
      out.push(`<p><b>${p}</b>: `+d.time.map((_,i)=>`${[t("today"),t("d1"),t("d2")][i]} ${Math.round(d.temperature_2m_max[i])}°C, ${t("rainw")} ${d.precipitation_probability_max[i]}%`).join(" · ")+"</p>");
      if(d.temperature_2m_max[0]>=35||d.temperature_2m_max[1]>=35)hot=true;
      if(d.precipitation_probability_max[0]>=60||d.precipitation_probability_max[1]>=60)wet=true;
    }
    if(!out.length)throw 0;
    el.innerHTML=out.join("")+`<div class="${hot||wet?"loss":"advice"}">${hot?t("hot")+" ":""}${wet?t("rain"):""}${hot||wet?"":t("wxOk")}</div>`;
  }catch(e){el.textContent=t("wxFail");}
}
function regret(){
  const crop=$("crop").value,q=+$("qty").value||1,origin=getOrigin();
  const R=rank(crop,q,origin);if(!R.length)return;
  const sm=$("soldM").value,km=MAND[sm]?roadKm(origin.c,MAND[sm]):0;
  const sp=+$("soldP").value,soldNet=sp*q-transport(km,q)-sp*q*(+$("comm").value||0)/100-(+$("load").value||0)*q,lost=R[0].net-soldNet;
  $("regOut").innerHTML=lost>0
    ?`<div class="loss">${t("lost")} ${inr(lost)}. ${t("lostB")} ${R[0].mandi}.</div>`
    :`<div class="advice">${t("noLoss")}</div>`;
}

function setv(id,v){if(v&&[...$(id).options].some(o=>o.value===v))$(id).value=v;}
function fillTaluks(tv){$("taluk").innerHTML=Object.keys(TAL[$("dist").value]).map(x=>`<option>${x}</option>`).join("");setv("taluk",tv);}
function fillSelects(){
  const cv=$("crop").value,mv=$("soldM").value,dv=$("dist").value,tv=$("taluk").value;
  const crops=[...new Set(prices.map(p=>p.crop))],mandis=[...new Set(prices.map(p=>p.mandi))];
  const cn=c=>L==="kn"&&CROPS[c]?CROPS[c].kn:c.charAt(0).toUpperCase()+c.slice(1);
  $("crop").innerHTML=crops.map(c=>`<option value="${c}">${cn(c)}</option>`).join("");
  $("soldM").innerHTML=mandis.map(m=>`<option>${m}</option>`).join("");
  $("dist").innerHTML=Object.keys(TAL).map(d=>`<option value="${d}">${L==="kn"&&DKN[d]?DKN[d]:d}</option>`).join("");
  setv("crop",cv);setv("soldM",mv);setv("dist",dv);fillTaluks(tv);
}
function applyLang(){
  document.documentElement.lang=L;fillSelects();
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  $("en").classList.toggle("on",L==="en");$("kn").classList.toggle("on",L==="kn");
  if($("out").innerHTML)run();
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert(t("nomic"));return;}
  const r=new SR();r.lang=L==="kn"?"kn-IN":"en-IN";
  r.onstart=()=>{$("heard").textContent=t("listening");};
  r.onerror=e=>{const k=e.error;
    if(k==="language-not-supported"&&r.lang!=="en-IN"){$("heard").textContent="Kannada voice not supported here, trying English…";const r2=new SR();r2.lang="en-IN";r2.onresult=r.onresult;r2.start();return;}
    $("heard").textContent=(k==="not-allowed"||k==="service-not-allowed")?t("micBlocked"):k==="network"?t("micNet"):t("noSpeech");};
  r.onresult=e=>{
    const x=e.results[0][0].transcript,lx=x.toLowerCase();
    $("heard").textContent=t("heard")+x;
    const n=x.match(/\d+(\.\d+)?/);if(n)$("qty").value=n[0];
    for(const d in TAL)for(const k in TAL[d])if(lx.includes(k.toLowerCase())){$("dist").value=d;fillTaluks(k);}
    for(const c in CROPS)if(lx.includes(c)||x.includes(CROPS[c].kn))$("crop").value=c;
    run();
  };
  r.start();
}
$("file").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(txt=>{
    const rows=txt.trim().split(/\r?\n/).slice(1).map(l=>l.split(","));
    const parsed=rows.map(c=>({date:c[0],mandi:c[1],crop:(c[2]||"").toLowerCase(),price:+c[3]})).filter(p=>p.date&&p.mandi&&p.price);
    if(parsed.length){prices=parsed;fillSelects();$("out").innerHTML="";}
  });
});
$("go").onclick=run;$("regGo").onclick=regret;$("mic").onclick=listen;
$("en").onclick=()=>{L="en";applyLang()};$("kn").onclick=()=>{L="kn";applyLang()};
try{$("tgt").value=localStorage.getItem("tgt")||""}catch(e){}
$("dist").onchange=()=>fillTaluks();
$("crop").onchange=()=>{const c=CROPS[$("crop").value];if(c){$("spoil").value=c.s;$("soldP").value=c.b;}};
fillSelects();$("crop").onchange();applyLang();
</script>
